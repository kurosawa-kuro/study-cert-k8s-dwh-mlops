# Kustomize設定ファイル（オプション）
# 使用する場合: kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: express-app
  namespace: express-app

resources:
- 01-namespace.yaml
- 02-config.yaml
- 03-deployment.yaml
- 04-service.yaml
- 05-hpa.yaml
- 06-network-policy.yaml
- 07-pod-disruption-budget.yaml
- 09-resource-quota.yaml

commonLabels:
  app: express
  version: v1.0.0
  environment: learning

namespace: express-app 