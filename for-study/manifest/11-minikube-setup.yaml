# Minikube環境用の追加設定
# このファイルはMinikube環境でのみ使用してください

---
# ローカルホストでのアクセス用Service（NodePort）
apiVersion: v1
kind: Service
metadata:
  name: express-svc-nodeport
  namespace: express-app
  labels:
    app: express
    type: nodeport
spec:
  type: NodePort
  selector:
    app: express
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP 